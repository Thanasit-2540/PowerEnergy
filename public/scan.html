<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Reader - ถ่ายรูป</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; transition: background-color 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col">

    <!-- LINE App Warning Overlay -->
    <div id="line-warning" class="fixed inset-0 bg-blue-600 z-[9999] text-white flex flex-col items-center justify-center p-6 text-center hidden">
        <i class="fa-solid fa-triangle-exclamation text-6xl text-yellow-300 mb-6"></i>
        <h2 class="text-2xl font-bold mb-4">เปิดผ่านแอป LINE ไม่ได้ครับ!</h2>
        <p class="mb-8 text-lg">แอป LINE บังคับไม่ให้ใช้กล้องถ่ายรูปสด<br>กรุณากดปุ่มด้านล่างเพื่อเปิดเว็บใน Safari หรือ Chrome</p>
        
        <button onclick="openExternalBrowser()" class="bg-white text-blue-600 font-bold text-xl px-8 py-4 rounded-full shadow-lg mb-6 hover:bg-gray-100 transition flex items-center">
            <i class="fa-solid fa-earth-americas mr-3"></i> กดเปิดเบราว์เซอร์ที่นี่
        </button>

        <p class="text-sm text-blue-200">
            * ถ้ากดปุ่มแล้วไม่เด้ง ให้กดปุ่ม <i class="fa-solid fa-ellipsis-vertical mx-1"></i> (3 จุด) มุมขวาบนสุด<br>แล้วเลือก <b>"เปิดด้วยเบราว์เซอร์เริ่มต้น"</b>
        </p>
    </div>

    <script>
        // เช็คว่าเป็นแอป LINE หรือไม่
        if (navigator.userAgent.indexOf("Line") > -1) {
            document.getElementById('line-warning').classList.remove('hidden');
        }

        function openExternalBrowser() {
            let url = window.location.href;
            if (url.indexOf('openExternalBrowser=1') === -1) {
                url += (url.indexOf('?') === -1 ? '?' : '&') + 'openExternalBrowser=1';
            }
            window.location.href = url;
        }
    </script>

    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 shadow-lg flex justify-between items-center relative">
        <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-camera mr-2"></i>ส่งรูปมิเตอร์</h1>
        <div class="flex items-center space-x-3">
            <button onclick="openExternalBrowser()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full text-sm font-bold transition flex items-center shadow-sm">
                <i class="fa-solid fa-earth-americas mr-1.5"></i>เปิดในเบราว์เซอร์
            </button>
            <button onclick="toggleTheme()" class="text-white hover:text-yellow-300 transition">
                <i class="fa-solid fa-circle-half-stroke text-xl"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-20 relative">
        <div id="loading-settings" class="text-center py-10">
            <i class="fa-solid fa-spinner fa-spin fa-3x text-blue-500 mb-4"></i>
            <p>กำลังเตรียมระบบ...</p>
        </div>

        <div id="form-container" class="hidden space-y-4 max-w-lg mx-auto">
            <!-- Meter Selection -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">1. จุดที่จด (มิเตอร์)</label>
                <select id="meter-select" class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="" disabled selected>-- เลือกจุดมิเตอร์ --</option>
                </select>
                <div id="meter-info" class="mt-2 text-sm text-blue-600 dark:text-blue-400 font-bold hidden"></div>
            </div>

            <!-- Recorder Selection -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-200 dark:border-gray-700">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">2. ชื่อผู้จด</label>
                <select id="recorder-select" class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="" disabled selected>-- เลือกชื่อของคุณ --</option>
                </select>
            </div>

            <!-- Camera Slots -->
            <div id="camera-section" class="hidden space-y-4">
                <h3 class="font-bold text-lg border-b pb-2 dark:border-gray-700">3. ถ่ายรูปมิเตอร์</h3>
                <div id="camera-slots" class="space-y-4"></div>
                
                <button id="btn-submit" onclick="submitPhotos()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg flex items-center justify-center hover:bg-blue-700 transition active:scale-95">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> บันทึกข้อมูลส่งเข้าระบบ
                </button>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
