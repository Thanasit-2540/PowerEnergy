<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; transition: background-color 0.3s ease; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col">

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-80 text-center">
            <h2 class="text-xl font-bold mb-4">เข้าสู่ระบบแอดมิน</h2>
            <input type="password" id="admin-pass" placeholder="รหัสผ่านแอดมิน" class="w-full p-2 mb-4 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none text-center">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">เข้าสู่ระบบ</button>
        </div>
    </div>

    <header class="bg-gradient-to-r from-gray-800 to-gray-900 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-user-shield mr-2 text-blue-400"></i>ศูนย์ข้อมูลแอดมิน</h1>
        <button onclick="document.documentElement.classList.toggle('dark')" class="text-white hover:text-yellow-300 transition">
            <i class="fa-solid fa-circle-half-stroke text-xl"></i>
        </button>
    </header>

    <div class="bg-white dark:bg-gray-800 shadow flex overflow-x-auto">
        <button onclick="showTab('today')" id="tab-today" class="tab-btn active px-6 py-3 whitespace-nowrap"><i class="fa-solid fa-calendar-day mr-2"></i>งานวันนี้</button>
        <button onclick="showTab('history')" id="tab-history" class="tab-btn px-6 py-3 whitespace-nowrap"><i class="fa-solid fa-clock-rotate-left mr-2"></i>ย้อนหลัง</button>
        <button onclick="showTab('settings')" id="tab-settings" class="tab-btn px-6 py-3 whitespace-nowrap"><i class="fa-solid fa-gear mr-2"></i>ตั้งค่าระบบ</button>
    </div>

    <main class="flex-1 overflow-y-auto p-4">
        
        <!-- Tab: Today & History share the same UI structure but history has date picker -->
        <div id="view-today" class="tab-content active space-y-6">
            <h2 class="text-xl font-bold border-b pb-2 dark:border-gray-700"><i class="fa-solid fa-calendar-day mr-2"></i>รูปภาพที่ส่งเข้ามาวันนี้</h2>
            <div id="today-container"></div>
        </div>

        <div id="view-history" class="tab-content space-y-6">
            <h2 class="text-xl font-bold border-b pb-2 dark:border-gray-700"><i class="fa-solid fa-clock-rotate-left mr-2"></i>ดูข้อมูลย้อนหลัง</h2>
            <div class="flex items-center space-x-2">
                <input type="date" id="history-date" class="p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                <button onclick="loadDataForDate(document.getElementById('history-date').value, 'history-container')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">ค้นหา</button>
            </div>
            <div id="history-container"></div>
        </div>

        <!-- Tab: Settings -->
        <div id="view-settings" class="tab-content space-y-6 max-w-4xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- พนักงาน -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
                    <h3 class="font-bold text-lg mb-4"><i class="fa-solid fa-users mr-2 text-blue-500"></i>รายชื่อพนักงาน</h3>
                    <div class="flex space-x-2 mb-4">
                        <input type="text" id="new-recorder" placeholder="ชื่อพนักงานใหม่" class="flex-1 p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                        <button onclick="addRecorder()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <ul id="recorders-list" class="space-y-2 max-h-60 overflow-y-auto"></ul>
                </div>

                <!-- การตั้งค่าอื่นๆ (ขยะ) -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
                    <h3 class="font-bold text-lg mb-4 text-red-500"><i class="fa-solid fa-trash mr-2"></i>ลบข้อมูลขยะ</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">ลบข้อมูลและรูปภาพที่อายุเกิน 60 วันออกจากฐานข้อมูล</p>
                    <button onclick="manualCleanup()" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600"><i class="fa-solid fa-triangle-exclamation mr-2"></i>สั่งลบข้อมูลเก่าเดี๋ยวนี้</button>
                    <p class="text-xs text-gray-400 mt-2">* ระบบอัตโนมัติจะลบข้อมูลที่เกิน 65 วันให้ทุกคืนอยู่แล้ว</p>
                </div>

                <!-- จุดมิเตอร์ -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow md:col-span-2">
                    <h3 class="font-bold text-lg mb-4"><i class="fa-solid fa-location-dot mr-2 text-green-500"></i>จุดมิเตอร์</h3>
                    <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-2 mb-4">
                        <input type="text" id="meter-id" placeholder="รหัสจุด (ห้ามเว้นวรรค)" class="flex-1 p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                        <input type="text" id="meter-name" placeholder="ชื่อจุด (แสดงผล)" class="flex-1 p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                        <select id="meter-type" class="p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
                            <option value="electric">ไฟฟ้า</option>
                            <option value="water">ประปา</option>
                        </select>
                        <button onclick="addMeter()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700"><i class="fa-solid fa-plus mr-2"></i>เพิ่มจุด</button>
                    </div>
                    <div id="meters-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80 text-center relative">
            <button onclick="closeQrModal()" class="absolute top-2 right-4 text-gray-500 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="qr-printable-area" class="bg-white p-4">
                <h3 class="font-bold text-lg text-black mb-4">สแกนเพื่อจดมิเตอร์</h3>
                <div id="qr-code-display" class="flex justify-center mb-4"></div>
                <div id="qr-details" class="text-black text-sm space-y-1"></div>
            </div>
            
            <div class="mt-4 flex space-x-2">
                <button onclick="downloadQR()" class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700"><i class="fa-solid fa-download mr-2"></i>โหลดรูป</button>
            </div>
        </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
